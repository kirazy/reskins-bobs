[mod-name]
reskins-bobs=Artisanal Reskins: Bob’s Mods

[mod-description]
reskins-bobs=Bietet neue Grafiken für Gegenstände, Objekte und Technologien aus Bob’s Mods, welche Färbung und Markierung nach Stufen unterstützen. Liefert hochaufgelöste Symbole und aktualisierte Grafiken im Stil vom Basisspiel, und unterstützt benutzerdefinierte Färbung und Markierung der Stufen. Teil der „Artisanal Reskins“ Serie.

[mod-setting-name]
reskins-bobs-do-bobrevamp-reactor-color=Bob’s Revamp: Reaktorfarben

reskins-bobs-flip-bulk-inserter-icons=Symbole für Stapelgreifarme spiegeln

reskins-bobs-do-furnace-tier-labeling=Stufenmarkierung für Schmelzöfen
reskins-bobs-do-inserter-tier-labeling=Stufenmarkierung für Greifarme

reskins-bobs-hydrazine-is-blue=Hydrazin ist blau!
reskins-bobs-show-alien-decoratives-on-lab=Alienlabor ist fremdartig!

reskins-bobs-do-progression-based-robots=Stufenmarkierung für Roboter nach Fortschritt
reskins-bobs-fusion-robot-color=Farbe: Fusionsgetriebene Roboter

reskins-bobs-do-custom-furnace-variants=Benutzerdefinierte Färbung für Öfentypen verwenden
reskins-bobs-standard-furnace-color=Farbe: Standardöfen
reskins-bobs-mixing-furnace-color=Farbe: Metallmischöfen
reskins-bobs-chemical-furnace-color=Farbe: Chemische Öfen

[mod-setting-description]
reskins-bobs-do-bobrevamp-reactor-color=Bietet neue Grafiken für Kernreaktoren, die auf die Uran-, Thorium- und Deuterium-Brennstoffe angepasst sind, anstatt nach Technologiestufe.


reskins-bobs-do-furnace-tier-labeling=Wenn Stufenmarkierungen aktiv sind, werden Stufenmarkierungen auch für Schmelzöfen, Hochöfen und Lichtbogenöfen aus der Mod „Bob’s Assembling Machines“ angezeigt.

reskins-bobs-hydrazine-is-blue=Färbt den Hydrazin-Generator [color=#7ac1de][font=default-bold]hell blau[/font][/color], so wie den Treibstoff – andernfalls wird er nach der vierten Stufe der Ölgeneratoren gefärbt.
reskins-bobs-show-alien-decoratives-on-lab=Zeigt fremdartige Wurzeln und Texturen auf dem Alienlabor.

reskins-bobs-do-progression-based-robots=Unter Verwendung der Stufenzuordnung nach [font=default-semibold]Fortschritt[/font] werden die Stufen der Logistik- und Bauroboter an die Roboter-Komponenten aus der Mod „Bob’s Logistik“ angeglichen. Fusionsgetriebene Roboter werden separat gefärbt nach der Einstellung [font=default-semibold]Farbe: Fusionsgetriebene Roboter[/font], behalten aber dieselbe Stufenmarkierung wie die nicht-fusionsgetriebenen Roboter 4.
reskins-bobs-fusion-robot-color=Legt die Farbe für fusionsgetriebene Roboter fest.

reskins-bobs-standard-furnace-color=Legt die Farbe für (flüssigkeitsbefeuerte) Schmelzöfen, Hochöfen und Lichtbogenöfen fest.
reskins-bobs-mixing-furnace-color=Legt die Farbe für (flüssigkeitsbefeuerte) Metallmisch-Öfen, -Hochöfen und -Lichtbogenöfen fest.
reskins-bobs-chemical-furnace-color=Legt die Farbe für (flüssigkeitsbefeuerte) chemische Öfen, Hochöfen und Lichtbogenöfen fest.

[item-name]
silicon=Silizium-Einkristall

