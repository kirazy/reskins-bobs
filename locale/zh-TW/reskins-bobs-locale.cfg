[mod-name]
reskins-bobs=Artisanal Reskins: Bob's Mods[手工換皮：Bob的Mods]

[mod-description]
reskins-bobs=在Bob的mod中重新調整物品，實體和技術的外觀，以添加層級顏色和圖標標籤。具有高分辨率圖標和更新的Sprite以與標準Factorio對齊，並支持玩家可定制的層標籤，顏色和映射。是手工換皮系列的一部分。

[mod-setting-name]
reskins-bobs-do-bobrevamp-reactor-color=Bob的改造：反應堆顏色


reskins-bobs-do-furnace-tier-labeling=爐層標籤
reskins-bobs-do-inserter-tier-labeling=插入層標籤

reskins-bobs-hydrazine-is-blue=肼是藍色的！
reskins-bobs-show-alien-decoratives-on-lab=外星實驗室是外星人！

reskins-bobs-do-basic-belts-separately=啟用自定義基本輸送帶著色
reskins-bobs-basic-belts-color=顏色：基本輸送帶

reskins-bobs-do-progression-based-robots=機器人跟隨進步
reskins-bobs-fusion-robot-color=顏色：融合機器人

reskins-bobs-do-custom-furnace-variants=啟用自訂熔爐第二顏色
reskins-bobs-standard-furnace-color=顏色：基本熔爐
reskins-bobs-mixing-furnace-color=顏色：混合熔爐
reskins-bobs-chemical-furnace-color=顏色：化工熔爐

[mod-setting-description]
reskins-bobs-do-bobrevamp-reactor-color=對核反應堆進行重新包裝，以便根據鈾或氘燃料的類型而不是根據層級對它們進行著色。


reskins-bobs-do-furnace-tier-labeling=啟用“層”標籤後，還會在Bob的Assembly添加的石爐，鋼爐和電爐項目上顯示層標籤。

reskins-bobs-hydrazine-is-blue=相對於燃料，為肼發生器上色[color=#7ac1de] [font=default-bold]淡藍色[/font] [/color]。否則，肼生成器將被著色為流體生成器的第四層。
reskins-bobs-show-alien-decoratives-on-lab=在外星實驗室上顯示外星人的根和紋理。

reskins-bobs-basic-belts-color=設置基本腰帶和相關實體的顏色。

reskins-bobs-do-progression-based-robots=使用[font=default-semibold] Progression [/font]層顯示樣式時，物流和建築機器人層與Bob的 Logistics添加的機器人組件保持一致。支持融合功能的機器人[font=default-semibold]顏色：融合機器人[/font]設置的顏色，同時與非融合機器人4s共享同一層。
reskins-bobs-fusion-robot-color=設置融合動力機器人的顏色。


