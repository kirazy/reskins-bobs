[mod-name]
reskins-bobs=Artisanal Reskins: Bob's Mods

[mod-description]
reskins-bobs=Ger föremål, objekt och teknologier i Bob's moddar nya utseenden med nivåfärger och ikonmarkeringar. Innehåller högupplösta ikoner och uppdaterade spritebilder som passar grundspelets utseende, samt nivåmarkeringar, färger och nivåindelning som spelaren kan anpassa. Ingår i serien Artisanal Reskins.

[mod-setting-name]
reskins-bobs-do-bobelectronics-colored-circuits=Bob's Electronics: färgade kretskort

reskins-bobs-flip-bulk-inserter-icons=Spegelvänd ikoner för bulklastkranar

reskins-bobs-do-furnace-tier-labeling=Nivåmarkeringar för ugnar
reskins-bobs-do-inserter-tier-labeling=Nivåmarkeringar för lastkranar

reskins-bobs-hydrazine-is-blue=Hydrazin är blått!
reskins-bobs-show-alien-decoratives-on-lab=Utomjordiskt laboratorium ser utomjordiskt ut!

reskins-bobs-do-progression-based-robots=Robotar följer progressionen
reskins-bobs-fusion-robot-color=Färg: fusionsrobotar

reskins-bobs-do-custom-furnace-variants=Aktivera egna färger för ugnsvarianter
reskins-bobs-standard-furnace-color=Färg: standardugnar
reskins-bobs-mixing-furnace-color=Färg: blandningsugnar
reskins-bobs-chemical-furnace-color=Färg: kemiska ugnar

[mod-setting-description]
reskins-bobs-do-bobelectronics-colored-circuits=Ger kretskorten från Bob's Electronics nya färger enligt den aktuella nivåindelningen.
reskins-bobs-do-bobrevamp-reactor-color=Ger kärnreaktorerna färger efter bränsletyperna uran, torium och deuterium i stället för efter nivå.

reskins-bobs-flip-bulk-inserter-icons=När Bob's Inserter Overhaul är aktiverat spegelvänds bulklastkranarnas ikoner horisontellt så att de blir lättare att skilja från vanliga lastkranar.

reskins-bobs-do-furnace-tier-labeling=När nivåmarkeringar är aktiverade visas de även på föremålen stenugn, stålugn och elektrisk ugn från Bob's Assembly.
reskins-bobs-do-inserter-tier-labeling=När nivåmarkeringar är aktiverade visas de även på lastkransföremålen från Bob's Logistics.

reskins-bobs-hydrazine-is-blue=Ger hydrazingeneratorn en [color=#7ac1de][font=default-bold]ljusblå[/font][/color] färg som anknyter till bränslet. Annars får hydrazingeneratorn färgen för den fjärde nivån av vätskegeneratorer.
reskins-bobs-show-alien-decoratives-on-lab=Visar utomjordiska rötter och texturer på det utomjordiska laboratoriet.

reskins-bobs-do-progression-based-robots=När nivåvisningsstilen [font=default-semibold]Progression[/font] används följer logistik- och konstruktionsrobotarnas nivåer robotkomponenterna från Bob's Logistics. Fusionsdrivna robotar får den färg som anges i [font=default-semibold]Färg: fusionsrobotar[/font], men delar nivå med Robot 4 utan fusionsdrift.
reskins-bobs-fusion-robot-color=Ställer in färgen för den fusionsdrivna roboten.

reskins-bobs-do-custom-furnace-variants=Aktiverar anpassning av färgerna för de olika ugnsvarianterna med färgväljarna nedan.
reskins-bobs-standard-furnace-color=Ställer in färgen för stenugnen, stålugnarna, de vätskebrännande ugnarna och de elektriska ugnarna.
reskins-bobs-mixing-furnace-color=Ställer in färgen för metallblandningsugnen av sten, metallblandningsugnarna av stål och med vätskebränsle samt den elektriska metallblandningsugnen.
reskins-bobs-chemical-furnace-color=Ställer in färgen för den kemiska stenugnen, de kemiska stålugnarna och vätskebrännande ugnarna samt den elektriska kemiska ugnen.

[item-name]
