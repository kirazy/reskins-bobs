[mod-setting-description]
reskins-bobs-do-bobassembly=Ger nya utseenden åt teknologierna, monteringsmaskinerna, ugnarna, raffinaderierna, destillerierna, elektrolysörerna och kemifabrikerna från Bob's Assembling Machines.
reskins-bobs-do-bobelectronics=Ger nya utseenden åt mellankomponenterna och recepten från Bob's Electronics. Påverkar inte kretskorten.
reskins-bobs-do-bobelectronics-colored-circuits=Ger kretskorten från Bob's Electronics nya färger enligt den aktuella nivåindelningen.
reskins-bobs-do-bobenemies=Ger nya utseenden åt de utomjordiska artefakterna från Bob's Enemies.
reskins-bobs-do-bobequipment=Ger nya utseenden åt teknologierna och utrustningen från Bob's Equipment.
reskins-bobs-do-bobgreenhouse=Ger nya utseenden åt mellankomponenterna, recepten, teknologierna och växthuset från Bob's Greenhouse.
reskins-bobs-do-boblogistics=Ger nya utseenden åt robotdelarna, teknologierna, logistikkistorna, robotbaserna och robotnätverkets byggnader samt lastkranarna, transportbanden, lagringstankarna, pumparna och rören från Bob's Logistics.
reskins-bobs-do-bobmining=Ger nya utseenden åt teknologierna, gruvborrarna och oljepumparna från Bob's Mining.
reskins-bobs-do-bobmodules=Ger nya utseenden åt modulerna, effektfördelarna och forskningslaboratoriet från Bob's Modules.
reskins-bobs-do-bobores=Ger nya utseenden åt resurserna och malmerna från Bob's Ores.
reskins-bobs-do-bobplates=Ger nya utseenden åt plåtarna, kugghjulen, lagren och andra mellankomponenter, recepten och teknologierna samt de små och genomströmmade lagringstankarna och pumparna från Bob's Metals, Chemicals, and Intermediates.
reskins-bobs-do-bobpower=Ger nya utseenden åt teknologierna, ångpannorna, ångmaskinerna och turbinerna, solpanelerna och ackumulatorerna, kärnreaktorerna, värmeväxlarna, värmerören och generatorerna från Bob's Power.
reskins-bobs-do-bobrevamp=Ger nya utseenden åt mellankomponenterna, recepten och teknologierna från Bob's Revamp.
reskins-bobs-do-bobrevamp-reactor-color=Ger kärnreaktorerna färger efter bränsletyperna uran, torium och deuterium i stället för efter nivå.
reskins-bobs-do-bobtech=Ger nya utseenden åt forskningspaketen, tillhörande teknologier och forskningslaboratorierna från Bob's Technology.
reskins-bobs-do-bobvehicleequipment=Ger nya utseenden åt teknologierna och utrustningen från Bob's Vehicle Equipment.
reskins-bobs-do-bobwarfare=Ger nya utseenden åt ammunitionen, teknologierna, tornen, murarna och radaranläggningarna från Bob's Warfare.

reskins-bobs-flip-bulk-inserter-icons=När Bob's Inserter Overhaul är aktiverat spegelvänds bulklastkranarnas ikoner horisontellt så att de blir lättare att skilja från vanliga lastkranar.

reskins-bobs-do-pipe-tier-labeling=När nivåmarkeringar är aktiverade visas de även på föremålen rör, underjordiska rör och värmerör från Bob's Logistics och Bob's Power.
reskins-bobs-do-belt-entity-tier-labeling=När nivåmarkeringar är aktiverade visas de även på föremålen transportband, underjordiska transportband och fördelare från Bob's Logistics.
reskins-bobs-do-furnace-tier-labeling=När nivåmarkeringar är aktiverade visas de även på föremålen stenugn, stålugn och elektrisk ugn från Bob's Assembly.
reskins-bobs-do-inserter-tier-labeling=När nivåmarkeringar är aktiverade visas de även på lastkransföremålen från Bob's Logistics.

reskins-bobs-hydrazine-is-blue=Ger hydrazingeneratorn en [color=#7ac1de][font=default-bold]ljusblå[/font][/color] färg som anknyter till bränslet. Annars får hydrazingeneratorn färgen för den fjärde nivån av vätskegeneratorer.
reskins-bobs-show-alien-decoratives-on-lab=Visar utomjordiska rötter och texturer på det utomjordiska laboratoriet.

reskins-bobs-do-basic-belts-separately=Aktiverar anpassning av de enkla transportbandens färg med färgväljaren nedan.
reskins-bobs-basic-belts-color=Ställer in färgen för enkla transportband och tillhörande objekt.

reskins-bobs-do-progression-based-robots=När nivåvisningsstilen [font=default-semibold]Progression[/font] används följer logistik- och konstruktionsrobotarnas nivåer robotkomponenterna från Bob's Logistics. Fusionsdrivna robotar får den färg som anges i [font=default-semibold]Färg: fusionsrobotar[/font], men delar nivå med Robot 4 utan fusionsdrift.
reskins-bobs-fusion-robot-color=Ställer in färgen för den fusionsdrivna roboten.

reskins-bobs-do-custom-furnace-variants=Aktiverar anpassning av färgerna för de olika ugnsvarianterna med färgväljarna nedan.
reskins-bobs-standard-furnace-color=Ställer in färgen för stenugnen, stålugnarna, de vätskebrännande ugnarna och de elektriska ugnarna.
reskins-bobs-mixing-furnace-color=Ställer in färgen för metallblandningsugnen av sten, metallblandningsugnarna av stål och med vätskebränsle samt den elektriska metallblandningsugnen.
reskins-bobs-chemical-furnace-color=Ställer in färgen för den kemiska stenugnen, de kemiska stålugnarna och vätskebrännande ugnarna samt den elektriska kemiska ugnen.

